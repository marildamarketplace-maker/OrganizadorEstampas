name: Validar aplicativo Windows

on:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Executar benchmark completo com 195 mil arquivos e três repetições'
        type: boolean
        default: false
  pull_request:
    branches:
      - main

permissions:
  contents: read
concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar testes em Windows nativo
        shell: pwsh
        run: |
          $env:MEURY_APP_DATA_PATH = Join-Path $env:RUNNER_TEMP "meury-tests"
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip oficial não encontrado no runner; a integração PSD é obrigatória." }
          $env:MEURY_7Z_PATH = $sevenZip
          $env:MEURY_PSD_VALIDATION_REPORT = Join-Path $env:GITHUB_WORKSPACE "reports/psd-compression-windows.json"
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar índice com 5 mil arquivos em Windows
        if: ${{ !inputs.full_benchmark }}
        run: python scripts/benchmark_index.py --count 5000 --repeats 1 --output reports/index-benchmark-windows.json

      - name: Validar índice completo com 195 mil arquivos em Windows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_benchmark }}
        run: python scripts/benchmark_index.py --count 195000 --repeats 3 --output reports/index-benchmark-windows.json

      - name: Disponibilizar evidência PSD Windows
        uses: actions/upload-artifact@v4
        with:
          name: psd-compression-windows
          path: reports/psd-compression-windows.json
          if-no-files-found: error

      - name: Disponibilizar medição do índice
        uses: actions/upload-artifact@v4
        with:
          name: index-benchmark-windows
          path: reports/index-benchmark-windows.json
          if-no-files-found: error

      - name: Validar previews em Windows
        run: python scripts/benchmark_previews.py --count 6 --output reports/preview-benchmark-windows.json

      - name: Disponibilizar medição dos previews
        uses: actions/upload-artifact@v4
        with:
          name: preview-benchmark-windows
          path: reports/preview-benchmark-windows.json
          if-no-files-found: error

      - name: Gerar aplicativo
        run: python build_app.py

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: MV-Image-Windows
          path: dist/MV Image/
          if-no-files-found: error
